services:
  auth-service:
    build: ./services/auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiame}
      PORT: "3001"
    volumes:
      - auth-data:/app/data
    ports:
      - "3001:3001"

  catalog-service:
    build: ./services/catalog-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiame}
      PORT: "3002"
    volumes:
      - catalog-data:/app/data
    ports:
      - "3002:3002"

  orders-service:
    build: ./services/orders-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiame}
      PORT: "3003"
      CATALOG_SERVICE_URL: http://catalog-service:3002
    depends_on:
      - catalog-service
    volumes:
      - orders-data:/app/data
    ports:
      - "3003:3003"

  frontend:
    build: ./client
    depends_on:
      - auth-service
      - catalog-service
      - orders-service
    ports:
      - "8080:80"

volumes:
  auth-data:
  catalog-data:
  orders-data:
