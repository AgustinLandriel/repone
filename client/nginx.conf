# Cumple el mismo rol que el proxy de Vite en dev y que el Ingress de Traefik en k8s
# más adelante: rutea por prefijo hacia el servicio dueño de cada dominio.
server {
    listen 80;

    location /api/auth/ {
        proxy_pass http://auth-service:3001;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:3002;
    }

    location /api/orders/ {
        proxy_pass http://orders-service:3003;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
